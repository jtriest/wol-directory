<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>WOL Directory</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Directory">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex, nofollow">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#f2f2f7; --card:#ffffff; --text:#000; --text2:#6c6c70; --text3:#aeaeb2;
  --sep:rgba(60,60,67,.16); --accent:#007aff; --accent-soft:rgba(0,122,255,.12);
  --fill:rgba(118,118,128,.12); --bar:rgba(242,242,247,.8); --tab:rgba(249,249,249,.86);
  --danger:#ff3b30; --green:#34c759; --shadow:0 10px 40px rgba(0,0,0,.12);
  --sheet:#f2f2f7; --raised:#ffffff;
  --hh:120px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000; --card:#1c1c1e; --text:#fff; --text2:#98989f; --text3:#5a5a5f;
    --sep:rgba(84,84,88,.55); --accent:#0a84ff; --accent-soft:rgba(10,132,255,.18);
    --fill:rgba(118,118,128,.24); --bar:rgba(0,0,0,.72); --tab:rgba(22,22,23,.86);
    --shadow:0 10px 40px rgba(0,0,0,.6); --sheet:#1c1c1e; --raised:#2c2c2e; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000; --card:#1c1c1e; --text:#fff; --text2:#98989f; --text3:#5a5a5f;
  --sep:rgba(84,84,88,.55); --accent:#0a84ff; --accent-soft:rgba(10,132,255,.18);
  --fill:rgba(118,118,128,.24); --bar:rgba(0,0,0,.72); --tab:rgba(22,22,23,.86);
  --shadow:0 10px 40px rgba(0,0,0,.6); --sheet:#1c1c1e; --raised:#2c2c2e; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:17px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;letter-spacing:-.01em;overscroll-behavior-y:none}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
[hidden]{display:none!important}
svg{display:block}
.ico{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- lock ---------- */
#lock{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px;
  padding-top:max(24px,env(safe-area-inset-top))}
.lock-in{width:100%;max-width:340px;text-align:center}
.lock-mark{width:76px;height:76px;margin:0 auto 22px;border-radius:18px;box-shadow:var(--shadow)}
.lock-in h1{font-size:28px;font-weight:700;margin:0 0 6px;letter-spacing:-.02em}
.lock-in p{color:var(--text2);margin:0 0 28px;font-size:15px}
.lock-field{display:block;width:100%;height:50px;border-radius:12px;border:0;background:var(--card);
  padding:0 16px;font-size:17px;text-align:center;outline:none;box-shadow:inset 0 0 0 1px var(--sep)}
.lock-field:focus{box-shadow:inset 0 0 0 2px var(--accent)}
.btn-primary{display:block;width:100%;height:50px;margin-top:12px;border-radius:12px;background:var(--accent);
  color:#fff;font-weight:600;font-size:17px}
.btn-primary:disabled{opacity:.5}
.lock-err{color:var(--danger);font-size:14px;min-height:20px;margin-top:12px}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* ---------- chrome ---------- */
.view{min-height:100dvh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.bar{position:sticky;top:0;z-index:20;background:var(--bar);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;border-bottom:.5px solid transparent;transition:border-color .2s}
.bar.scrolled{border-bottom-color:var(--sep)}
.titlerow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;min-height:44px}
.titlerow h1{margin:0;font-size:34px;font-weight:700;letter-spacing:-.025em;line-height:1.1}
.iconbtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--accent);
  background:var(--fill);flex:none}
.iconbtn .ico{width:20px;height:20px}
.search{display:block;position:relative;margin-top:10px}
.search .ico{position:absolute;left:9px;top:9px;width:18px;height:18px;color:var(--text2)}
.search input{width:100%;height:36px;border:0;border-radius:10px;background:var(--fill);padding:0 32px 0 34px;
  font-size:17px;outline:none;-webkit-appearance:none}
.search input::placeholder{color:var(--text2)}
.search .clear{position:absolute;right:6px;top:8px;width:20px;height:20px;border-radius:50%;background:var(--text3);
  color:var(--card);display:grid;place-items:center}
.search .clear .ico{position:static;width:12px;height:12px;color:var(--card);stroke-width:3}
.meta{font-size:13px;color:var(--text2);margin:8px 2px 0}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;
  background:var(--tab);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid var(--sep);padding:7px 0 calc(env(safe-area-inset-bottom) + 6px)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:500;color:var(--text3)}
.tab .ico{width:26px;height:26px;stroke-width:1.7}
.tab.on{color:var(--accent)}

/* ---------- list ---------- */
#list{padding:0 26px 0 16px}
#list.noidx{padding-right:16px}

.sh{position:sticky;top:var(--hh);z-index:5;margin:0 -16px;padding:14px 32px 6px;font-size:13px;font-weight:600;
  color:var(--text2);letter-spacing:.02em;background:linear-gradient(var(--bg) 70%,transparent)}
.group{background:var(--card);border-radius:12px;overflow:hidden}
.row{position:relative;display:flex;align-items:center;gap:12px;padding:11px 16px;min-height:60px;cursor:pointer}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.row:active{background:var(--fill)}
.row .main{flex:1;min-width:0}
.nm{font-size:16px;line-height:1.28}
.nm b{font-weight:600}
.nm span{color:var(--text)}
.sub{font-size:14px;color:var(--text2);margin-top:3px;line-height:1.3}
.sub a{color:var(--text2)}
.sub a:active{color:var(--accent)}
.ph{flex:none;font-size:14.5px;color:var(--accent);font-variant-numeric:tabular-nums;padding:8px 0 8px 6px;white-space:nowrap}
.ph small{display:block;font-size:11px;color:var(--text2);text-align:right}
.empty{text-align:center;color:var(--text2);padding:60px 20px}
.foot{text-align:center;color:var(--text3);font-size:13px;padding:28px 0 8px}

#idx{position:fixed;right:1px;z-index:25;display:flex;flex-direction:column;align-items:center;
  font-size:11px;font-weight:600;color:var(--accent);padding:4px 3px;touch-action:none;user-select:none;-webkit-user-select:none}
#idx span{line-height:1;padding:1.5px 4px}
#bubble{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:80px;height:80px;border-radius:20px;
  background:var(--tab);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:var(--shadow);
  display:grid;place-items:center;font-size:40px;font-weight:600;z-index:40;pointer-events:none;opacity:0;transition:opacity .15s}
#bubble.on{opacity:1}

/* ---------- sheet ---------- */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:50;opacity:0;pointer-events:none;transition:opacity .28s}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-height:90dvh;overflow:auto;background:var(--sheet);
  border-radius:14px 14px 0 0;transform:translateY(105%);transition:transform .34s cubic-bezier(.32,.72,0,1);
  padding:8px 16px calc(24px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
#sheet.on{transform:none}
.grab{width:36px;height:5px;border-radius:3px;background:var(--text3);opacity:.6;margin:0 auto 10px}
.sheet-top{display:flex;justify-content:flex-end;margin-bottom:-6px}
.link{color:var(--accent);font-size:17px;padding:6px 0}
.link.b{font-weight:600}
.d-name{text-align:center;padding:4px 8px 18px}
.avatar{width:64px;height:64px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;
  font-size:26px;font-weight:600;color:#fff;background:linear-gradient(180deg,#a5a9b3,#858993)}
.d-name h2{margin:0;font-size:26px;font-weight:700;letter-spacing:-.02em}
.d-name .given{color:var(--text2);margin-top:4px;font-size:16px}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px}
.act{background:var(--card);border-radius:12px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;
  color:var(--accent);font-size:12px}
.act.off{color:var(--text3);pointer-events:none}
.act .ico{width:22px;height:22px}
.cell-group{background:var(--card);border-radius:12px;overflow:hidden;margin-bottom:18px}
.cell{position:relative;display:flex;align-items:center;gap:12px;padding:11px 16px;min-height:50px}
.cell+.cell::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.cell:active{background:var(--fill)}
.cell .l{flex:1;min-width:0}
.cell .k{font-size:13px;color:var(--text2)}
.cell .v{font-size:17px;color:var(--accent);margin-top:1px}
.cell .v.plain{color:var(--text)}
.cell .chev{color:var(--text3);width:16px;height:16px}
#sheet .act,#sheet .cell-group{background:var(--raised)}
#sheet .seg button.on{background:var(--raised)}
.note{font-size:13px;color:var(--text2);padding:0 16px;margin:-10px 0 18px}

/* ---------- full-screen pages ---------- */
.page{position:fixed;inset:0;z-index:45;background:var(--bg);overflow:auto;transform:translateY(100%);
  transition:transform .38s cubic-bezier(.32,.72,0,1);padding-bottom:calc(30px + env(safe-area-inset-bottom))}
.page.on{transform:none}
.page.push{transform:translateX(100%)}
.page.push.on{transform:none}
.navbar{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  padding:calc(env(safe-area-inset-top) + 6px) 16px 8px;background:var(--bar);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--sep)}
.navbar .t{font-weight:600;font-size:17px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56vw}
.navbar .r{justify-self:end}
.navbar .back{display:flex;align-items:center;gap:2px;color:var(--accent);margin-left:-6px}
.pad{padding:0 16px}
.label{font-size:13px;color:var(--text2);text-transform:uppercase;letter-spacing:.03em;margin:22px 16px 7px}
.field{width:100%;height:50px;border:0;border-radius:12px;background:var(--card);padding:0 16px;font-size:17px;outline:none}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px}
.seg button{flex:1;height:32px;border-radius:7px;font-size:14px;font-weight:500}
.seg button.on{background:var(--card);box-shadow:0 2px 6px rgba(0,0,0,.12)}
:root[data-theme="dark"] .seg button.on{background:#636366}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button.on{background:#636366}}
.toggle{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:12px;padding:0 16px;height:50px;margin-top:10px}
.switch{width:51px;height:31px;border-radius:16px;background:var(--fill);position:relative;transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;
  box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .2s}
.switch.on{background:var(--green)}
.switch.on::after{transform:translateX(20px)}
.picked{display:flex;align-items:center;justify-content:space-between;margin:22px 16px 7px;font-size:13px;color:var(--text2)}
.picked b{color:var(--text);font-weight:600}
.chk{flex:none;width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--text3);display:grid;place-items:center}
.row.sel .chk{background:var(--accent);box-shadow:none}
.chk .ico{width:14px;height:14px;color:#fff;stroke-width:3;opacity:0}
.row.sel .chk .ico{opacity:1}
.sticky-search{position:sticky;top:calc(env(safe-area-inset-top) + 51px);z-index:4;background:var(--bg);padding:6px 16px 8px}
.sticky-search .search{margin:0}

/* ---------- routes ---------- */
.rcard{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:14px;padding:14px 16px;margin:0 16px 10px;cursor:pointer}
.rcard:active{opacity:.7}
.rbadge{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.rcard h3{margin:0;font-size:17px;font-weight:600}
.rcard p{margin:3px 0 0;font-size:14px;color:var(--text2)}
.rcard .l{flex:1;min-width:0}
.prog{height:4px;border-radius:2px;background:var(--fill);margin-top:8px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--green);border-radius:2px}
.hero{text-align:center;padding:60px 32px}
.hero .rbadge{width:64px;height:64px;border-radius:18px;margin:0 auto 16px}
.hero .rbadge .ico{width:30px;height:30px}
.hero h2{margin:0 0 8px;font-size:22px}
.hero p{margin:0 0 22px;color:var(--text2);font-size:15px;line-height:1.45}
.btn-pill{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 22px;border-radius:22px;background:var(--accent);color:#fff;font-weight:600}
.stats{display:flex;gap:10px;margin:14px 16px 0}
.stat{flex:1;background:var(--card);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-size:22px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--text2)}
.go-main{display:flex;align-items:center;justify-content:center;gap:8px;margin:14px 16px 0;height:50px;border-radius:12px;
  background:var(--accent);color:#fff;font-weight:600;font-size:17px}
.go-sub{font-size:13px;color:var(--text2);text-align:center;margin:8px 24px 0;line-height:1.4}
.stop{position:relative;display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px;min-height:64px}
.stop+.stop::before{content:"";position:absolute;top:0;left:56px;right:0;border-top:.5px solid var(--sep)}
.num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-size:14px;font-weight:700;
  display:grid;place-items:center;font-variant-numeric:tabular-nums}
.stop.done .num{background:var(--green)}
.stop.done .main{opacity:.45}
.stop.done .nm b{text-decoration:line-through}
.stop .main{flex:1;min-width:0;cursor:pointer}
.mini{flex:none;width:36px;height:36px;border-radius:50%;background:var(--fill);color:var(--accent);display:grid;place-items:center}
.mini .ico{width:18px;height:18px}
.mini.go{background:var(--accent);color:#fff}
.flag{font-size:12px;color:#ff9500}
.danger{color:var(--danger)}
.btn-row{display:flex;gap:10px;margin:18px 16px 0}
.btn-row button{flex:1;height:44px;border-radius:12px;background:var(--card);color:var(--accent);font-weight:500;font-size:16px}
.btn-row button.danger{color:var(--danger)}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:60;
  background:rgba(30,30,32,.92);color:#fff;font-size:15px;padding:10px 18px;border-radius:20px;opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (min-width:700px){#list,.wrap{max-width:720px;margin:0 auto}.bar>*{max-width:688px;margin-left:auto;margin-right:auto}}
</style>
</head>

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const enc = encodeURIComponent;
const icon = (n, cls='ico') => `<svg class="${cls}"><use href="#i-${n}"/></svg>`;
const store = {
  get(k, d){ try{ const v = localStorage.getItem('wol.'+k); return v == null ? d : JSON.parse(v); }catch{ return d; } },
  set(k, v){ try{ localStorage.setItem('wol.'+k, JSON.stringify(v)); }catch{} },
  del(k){ try{ localStorage.removeItem('wol.'+k); }catch{} }
};

/* ---------------- crypto ---------------- */
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64e = b => btoa(String.fromCharCode(...new Uint8Array(b)));
async function deriveKey(pass){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:b64d(PAYLOAD.salt), iterations:PAYLOAD.iter, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, true, ['decrypt']);
}
async function decryptWith(key){
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(PAYLOAD.iv)}, key, b64d(PAYLOAD.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function tryStoredKey(){
  const raw = store.get('key');
  if(!raw) return null;
  try{
    const key = await crypto.subtle.importKey('raw', b64d(raw), {name:'AES-GCM'}, false, ['decrypt']);
    return await decryptWith(key);
  }catch{ store.del('key'); return null; }
}

/* ---------------- settings ---------------- */
const settings = Object.assign({theme:'auto', maps:'apple'}, store.get('settings', {}));
function applyTheme(){ document.documentElement.dataset.theme = settings.theme; }
applyTheme();

/* ---------------- data ---------------- */
let D = [];
function telOf(num, intl){
  const d = num.replace(/\D/g, '');
  if(d.startsWith('0')) return '+972' + d.slice(1);
  if(d.length === 10) return '+1' + d;
  return (intl ? '+' : '') + d;
}
function parsePhones(raw, city){
  if(!raw) return [];
  return raw.split(/,\s*/).map(p => {
    const m = p.match(/^([A-Za-z][A-Za-z.]*?)\.?\s*(\d[\d\- ]+\d)$/);
    const label = m ? m[1].replace(/\.$/, '') : '';
    const num = (m ? m[2] : p).trim();
    return {label, num, tel: telOf(num, /Israel/.test(city))};
  });
}
function prep(rows){
  D = rows.map((r, i) => {
    const [name, phone, address, city, lat, lng, approx] = r;
    const k = name.indexOf(',');
    const sur = (k > 0 ? name.slice(0, k) : name).trim();
    const rest = (k > 0 ? name.slice(k + 1) : '').trim();
    const phones = parsePhones(phone, city);
    const short = city.replace(/,\s*MI\s*\d{5}$/, '').replace(/\s+\d{5}$/, '');
    const letter = (sur.match(/[A-Za-z]/) || ['#'])[0].toUpperCase();
    return {i, name, sur, rest, phone, phones, address, city, short, letter,
      ll: lat == null ? null : [lat, lng], approx: !!approx,
      hay: (name + ' ' + address + ' ' + city + ' ' + phone.replace(/\D/g, '')).toLowerCase()};
  });
}
const mapQuery = p => (p.address ? p.address.replace(/,?\s*(Apt\.?|Unit|Suite)\s*#?.*$/i, '') + ', ' : '') + p.city;
function mapURL(p, directions){
  const q = mapQuery(p);
  if(settings.maps === 'google') return directions
    ? `https://www.google.com/maps/dir/?api=1&destination=${enc(q)}&travelmode=driving`
    : `https://www.google.com/maps/search/?api=1&query=${enc(q)}`;
  if(settings.maps === 'waze') return p.ll
    ? `https://waze.com/ul?ll=${p.ll[0]},${p.ll[1]}${directions ? '&navigate=yes' : ''}`
    : `https://waze.com/ul?q=${enc(q)}${directions ? '&navigate=yes' : ''}`;

(function idxScrub(){
  const idx = $('#idx'), bubble = $('#bubble');
  let last = null;
  const at = e => {
    const t = e.touches ? e.touches[0] : e;
    const r = idx.getBoundingClientRect(), kids = idx.children;
    if(!kids.length) return;
    const i = Math.max(0, Math.min(kids.length - 1, Math.floor((t.clientY - r.top) / r.height * kids.length)));
    const l = kids[i].textContent;
    if(l !== last){ last = l; jumpTo(l); bubble.textContent = l; bubble.classList.add('on');
      if(navigator.vibrate) navigator.vibrate(4); }
  };
  const end = () => { last = null; bubble.classList.remove('on'); };
  idx.addEventListener('touchstart', e => { e.preventDefault(); at(e); }, {passive:false});
  idx.addEventListener('touchmove', e => { e.preventDefault(); at(e); }, {passive:false});
  idx.addEventListener('touchend', end);
  idx.addEventListener('mousedown', e => { at(e); const mv = ev => at(ev);
    addEventListener('mousemove', mv); addEventListener('mouseup', () => { removeEventListener('mousemove', mv); end(); }, {once:true}); });
})();

/* ---------------- routing math ---------------- */
function hav(a, b){
  const R = 3958.8, r = Math.PI / 180;
  const dLat = (b[0] - a[0]) * r, dLng = (b[1] - a[1]) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
// Orders points to minimise total distance: nearest-neighbour seeds, then 2-opt + or-opt.
// start: optional [lat,lng] fixed origin; ret: return to origin.
function optimize(pts, start, ret){
  const n = pts.length;
  if(n < 2) return pts.map((_, i) => i);
  const nodes = start ? [start, ...pts] : pts;
  const N = nodes.length, M = [];
  for(let i = 0; i < N; i++){ M[i] = new Float64Array(N); for(let j = 0; j < N; j++) M[i][j] = i === j ? 0 : hav(nodes[i], nodes[j]); }
  const fixed = !!start, closed = fixed && ret;
  const cost = t => { let s = 0; for(let i = 1; i < t.length; i++) s += M[t[i - 1]][t[i]]; return closed ? s + M[t[t.length - 1]][t[0]] : s; };
  const nn = s => { const t = [s], used = new Uint8Array(N); used[s] = 1;
    for(let k = 1; k < N; k++){ const a = t[t.length - 1]; let b = -1, bd = Infinity;
      for(let j = 0; j < N; j++) if(!used[j] && M[a][j] < bd){ bd = M[a][j]; b = j; }
      t.push(b); used[b] = 1; } return t; };
  const improve = t => {
    const lo = fixed ? 1 : 0;
    let better = true, guard = 0;
    while(better && guard++ < 200){
      better = false;
      // 2-opt
      for(let i = lo; i < N - 1; i++) for(let j = i + 1; j < N; j++){
        const a = i > 0 ? t[i - 1] : -1, b = t[i], c = t[j], d = j + 1 < N ? t[j + 1] : (closed ? t[0] : -1);
        const before = (a >= 0 ? M[a][b] : 0) + (d >= 0 ? M[c][d] : 0);
        const after = (a >= 0 ? M[a][c] : 0) + (d >= 0 ? M[b][d] : 0);
        if(after < before - 1e-9){ for(let x = i, y = j; x < y; x++, y--){ const tmp = t[x]; t[x] = t[y]; t[y] = tmp; } better = true; }
      }
      // or-opt: move one stop elsewhere
      for(let i = lo; i < N; i++){
        const base = cost(t);
        for(let j = lo; j < N; j++){ if(j === i) continue;
          const u = t.slice(); const [v] = u.splice(i, 1); u.splice(j, 0, v);
          if(cost(u) < base - 1e-9){ t.splice(0, N, ...u); better = true; break; } }
      }
    }
    return t;
  };
  let best = null, bestC = Infinity;
  const starts = fixed ? [0] : [...Array(N).keys()].slice(0, Math.min(N, N > 60 ? 12 : 30));
  for(const s of starts){ const t = improve(nn(s)); const c = cost(t); if(c < bestC){ bestC = c; best = t.slice(); } }
  return (fixed ? best.slice(1).map(x => x - 1) : best);
}
function routeStats(r){
  const ids = r.ids.filter(i => D[i].ll);
  let mi = 0, prev = r.start || null;
  for(const i of ids){ if(prev) mi += hav(prev, D[i].ll); prev = D[i].ll; }
  if(r.ret && r.start && prev) mi += hav(prev, r.start);
  const road = mi * 1.3;
  return {miles: road, mins: Math.max(1, Math.round(road / 22 * 60))};
}
function reorder(r){
  const withLL = r.ids.filter(i => D[i].ll), without = r.ids.filter(i => !D[i].ll);
  const ord = optimize(withLL.map(i => D[i].ll), r.start, r.ret);
  r.ids = [...ord.map(k => withLL[k]), ...without];
}

  }

function here(){
  return new Promise((res, rej) => {
    if(!navigator.geolocation) return rej();
    navigator.geolocation.getCurrentPosition(p => res([+p.coords.latitude.toFixed(5), +p.coords.longitude.toFixed(5)]), rej,
      {enableHighAccuracy: false, timeout: 10000, maximumAge: 120000});
  });
}

/* ---------------- route view ---------------- */
let RV = null;
const MAPS_NAME = {apple: 'Apple Maps', google: 'Google Maps', waze: 'Waze'};
// Google Maps links take up to 9 waypoints, so it gets the next 10 stops as one trip.
// Apple Maps and Waze links take a single destination, so they get the next stop.
function nextLeg(r){
  const left = r.ids.filter(i => !r.done.includes(i) && (D[i].address || D[i].ll));
  if(!left.length) return null;
  if(settings.maps !== 'google'){
    const i = left[0];
    return {url: mapURL(D[i], true), n: 1, stop: r.ids.indexOf(i) + 1};
  }
  const legs = left.slice(0, 10), dest = legs[legs.length - 1], way = legs.slice(0, -1);
  let url = `https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=${enc(mapQuery(D[dest]))}`;
  if(way.length) url += `&waypoints=${way.map(i => enc(mapQuery(D[i]))).join('%7C')}`;
  return {url, n: legs.length};
}
function showRoute(id){

  if(!r) return;
  RV = id;
  const s = routeStats(r), done = r.done.length;
  const leg = nextLeg(r), app = MAPS_NAME[settings.maps];

    return `<div class="stop ${isDone ? 'done' : ''}" data-i="${i}">

      ${ph ? `<a class="mini" href="tel:${ph.tel}" aria-label="Call">${icon('phone')}</a>` : ''}
      <a class="mini go" href="${mapURL(p, true)}" target="_blank" rel="noopener" aria-label="Directions">${icon('nav')}</a></div>`;
  }).join('');
  const pg = $('#routeView');
  pg.innerHTML = `
    <div class="navbar"><button class="back" id="rvBack">${icon('back')}Routes</button><div class="t">${esc(r.name)}</div>
      <div class="r"><button class="iconbtn" id="rvShare" aria-label="Share" style="background:none">${icon('share')}</button></div></div>
    <div class="wrap">
      <div class="stats">
        <div class="stat"><b>${r.ids.length}</b><span>stops${done ? ` · ${done} done` : ''}</span></div>
        <div class="stat"><b>${fmtMi(s.miles)}</b><span>miles, approx.</span></div>
        <div class="stat"><b>${fmtMin(s.mins).replace(' min', 'm').replace(' hr', 'h')}</b><span>driving</span></div>
      </div>
      ${leg ? (leg.stop
        ? `<a class="go-main" href="${leg.url}" target="_blank" rel="noopener">${icon('car')}Go to Stop ${leg.stop} in ${app}</a>
          <div class="go-sub">Tap a number to mark it done; this button moves on to the next stop.</div>`
        : `<a class="go-main" href="${leg.url}" target="_blank" rel="noopener">${icon('car')}${done ? 'Continue' : 'Start'} in ${app}</a>
          <div class="go-sub">Opens the next ${leg.n} stop${leg.n === 1 ? '' : 's'} as one trip from where you are. Tap a number to mark it done; the button moves on to the following stops.</div>`)
        : `<div class="go-sub" style="margin-top:16px">All stops done. 🎉</div>`}
      <div class="label">${r.start ? 'From your location' : 'Best order'}${r.ret ? ' · round trip' : ''}</div>
      <div class="cell-group" style="margin:0 16px">${stops}</div>
      <div class="btn-row"><button id="rvEdit">Edit Stops</button><button id="rvReopt">Re-optimize</button></div>
      <div class="btn-row"><button id="rvReset">Clear Progress</button><button class="danger" id="rvDel">Delete</button></div>
    </div>`;
  requestAnimationFrame(() => pg.classList.add('on'));
}
$('#routeView').addEventListener('click', async e => {
  const r = routes.find(x => x.id === RV);
  if(!r) return;
  const tg = e.target.closest('[data-toggle]');
  if(tg){ const i = +tg.dataset.toggle; r.done.includes(i) ? r.done = r.done.filter(x => x !== i) : r.done.push(i);
    saveRoutes(); const st = $('#routeView').scrollTop; showRoute(r.id); $('#routeView').scrollTop = st; renderRoutes(); return; }
  const pp = e.target.closest('[data-person]');
  if(pp){ showPerson(+pp.dataset.person); return; }
  if(e.target.closest('#rvBack')){ closePage('#routeView'); renderRoutes(); return; }
  if(e.target.closest('#rvEdit')){ openBuilder(r); return; }
  if(e.target.closest('#rvReopt')){
    if(r.start){ const s = await here().catch(() => null); if(s) r.start = s; }
    const pending = r.ids.filter(i => !r.done.includes(i)), finished = r.ids.filter(i => r.done.includes(i));
    const tmp = {ids: pending, start: r.start, ret: r.ret}; reorder(tmp);
    r.ids = [...finished, ...tmp.ids]; saveRoutes(); showRoute(r.id); toast('Re-optimized from here'); return;
  }
  if(e.target.closest('#rvReset')){ r.done = []; saveRoutes(); showRoute(r.id); renderRoutes(); return; }
  if(e.target.closest('#rvDel')){
    if(!confirm(`Delete “${r.name}”?`)) return;
    routes = routes.filter(x => x.id !== r.id); saveRoutes(); closePage('#routeView'); renderRoutes(); return;
  }
  if(e.target.closest('#rvShare')) shareRoute(r);
});
function shareRoute(r){
  const code = btoa(JSON.stringify({n: r.name, i: r.ids, r: r.ret ? 1 : 0})).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  const url = location.origin + location.pathname + '#route=' + code;
  const text = `${r.name}\n` + r.ids.map((i, k) => `${k + 1}. ${D[i].sur} — ${D[i].address}`).join('\n');
  if(navigator.share) navigator.share({title: r.name, text: r.name + ' (open in the Directory app)', url}).catch(() => {});
  else navigator.clipboard?.writeText(url + '\n\n' + text).then(() => toast('Link copied'));
}
function importFromHash(){
  const m = location.hash.match(/#route=([\w-]+)/);
  if(!m) return;
  history.replaceState(null, '', location.pathname);
  try{
    const o = JSON.parse(atob(m[1].replace(/-/g, '+').replace(/_/g, '/')));
    const ids = (o.i || []).filter(i => D[i]);
    if(!ids.length) return;
    const r = {id: Date.now().toString(36), name: o.n || 'Shared Route', ids, start: null, ret: false, done: [], created: Date.now()};
    routes.unshift(r); saveRoutes();
    document.querySelector('.tab[data-tab="routes"]').click();
    showRoute(r.id); toast('Route added');
  }catch{}
}

/* ---------------- add to route from person ---------------- */
function addToRouteSheet(i){
  const p = D[i];
  openSheet(`<div class="sheet-top"><button class="link" data-close>Cancel</button></div>
    <h2 style="margin:0 0 14px;font-size:22px">Add ${esc(p.sur)} to…</h2>
    <div class="cell-group">
      <button class="cell" data-newwith="${i}" style="width:100%;text-align:left"><div class="l"><div class="v">New Route…</div></div>${icon('plus', 'ico chev')}</button>
      ${routes.map(r => `<button class="cell" data-addto="${r.id}" data-i="${i}" style="width:100%;text-align:left"><div class="l"><div class="v plain">${esc(r.name)}</div>
        <div class="k">${r.ids.length} stops${r.ids.includes(i) ? ' · already included' : ''}</div></div></button>`).join('')}
    </div>`);
}

/* ---------------- global delegation ---------------- */
$('#list').addEventListener('click', e => {
  if(e.target.closest('a')) return;
  const row = e.target.closest('.row'); if(row) showPerson(+row.dataset.i);
});
$('#sheet').addEventListener('click', e => {
  const ar = e.target.closest('[data-addroute]');
  if(ar){ addToRouteSheet(+ar.dataset.addroute); return; }
  const nw = e.target.closest('[data-newwith]');
  if(nw){ closeSheet(); openBuilder(null, [+nw.dataset.newwith]); return; }
  const at = e.target.closest('[data-addto]');
  if(at){ const r = routes.find(x => x.id === at.dataset.addto), i = +at.dataset.i;
    if(r && !r.ids.includes(i)){ r.ids.push(i);
      const pending = r.ids.filter(x => !r.done.includes(x)), fin = r.ids.filter(x => r.done.includes(x));
      const tmp = {ids: pending, start: r.start, ret: r.ret}; reorder(tmp); r.ids = [...fin, ...tmp.ids]; saveRoutes(); renderRoutes(); }
    closeSheet(); toast(`Added to ${r ? r.name : 'route'}`);
    if(RV === r?.id && $('#routeView').classList.contains('on')) showRoute(r.id);
  }
});
$('#routeList').addEventListener('click', e => {
  if(e.target.closest('[data-newroute]')){ openBuilder(); return; }
  const c = e.target.closest('[data-route]'); if(c) showRoute(c.dataset.route);
});
$('#newRouteBtn').addEventListener('click', () => openBuilder());
$('#settingsBtn').addEventListener('click', showSettings);
let qT;
$('#q').addEventListener('input', () => { clearTimeout(qT); qT = setTimeout(() => { renderPeople(); scrollTo(0, 0); }, 60); });
$('#qClear').addEventListener('click', () => { $('#q').value = ''; renderPeople(); $('#q').blur(); });

let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2200); }

/* ---------------- boot ---------------- */
function start(rows){
  prep(rows);
  $('#lock').hidden = true; $('#app').hidden = false;
  renderPeople(); renderRoutes();
  requestAnimationFrame(placeIdx);
  importFromHash();
}
$('#lockForm').addEventListener('submit', async e => {
  e.preventDefault();
  const pass = $('#pass').value.trim(), btn = $('#unlockBtn');
  if(!pass) return;
  btn.disabled = true; btn.textContent = 'Unlocking…'; $('#lockErr').textContent = '';
  try{
    const key = await deriveKey(pass);
    const rows = await decryptWith(key);
    store.set('key', b64e(await crypto.subtle.exportKey('raw', key)));
    $('#pass').blur(); start(rows);
  }catch{
    $('#lockErr').textContent = 'That passcode didn’t work.';
    const f = $('#lockForm'); f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake');
  }
  btn.disabled = false; btn.textContent = 'Unlock';
});
addEventListener('hashchange', () => { if(D.length) importFromHash(); });
(async () => {
  const rows = await tryStoredKey();
  if(rows) start(rows); else { $('#lock').hidden = false; }
})();
if('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
