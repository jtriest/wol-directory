<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>WOL Directory</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Directory">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex, nofollow">
<link rel="apple-touch-icon" href="icon-180.png?v=645d21b3">
<link rel="icon" href="icon-180.png?v=645d21b3">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#ffffff; --group:#f2f2f7; --card:#ffffff; --raised:#ffffff;
  --text:#000; --text2:#6c6c70; --text3:#8e8e93; --text4:#c7c7cc;
  --sep:rgba(60,60,67,.17); --fill:rgba(118,118,128,.12); --fill2:#f2f2f7;
  --accent:#86672F; --on-accent:#ffffff; --tint:rgba(134,103,47,.12); --brand:#94723A; --green:#34c759; --danger:#ff3b30;
  --bar:rgba(255,255,255,.82); --gbar:rgba(242,242,247,.82); --menu:rgba(252,252,252,.94);
  --shadow:0 12px 40px rgba(0,0,0,.16);
  --hh:150px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000; --group:#000; --card:#1c1c1e; --raised:#2c2c2e;
    --text:#fff; --text2:#98989f; --text3:#8d8d93; --text4:#48484a;
    --sep:rgba(84,84,88,.6); --fill:rgba(118,118,128,.24); --fill2:#1c1c1e;
    --accent:#D6B474; --on-accent:#1a1408; --tint:rgba(214,180,116,.18); --brand:#D9BA7C; --green:#30d158; --danger:#ff453a;
    --bar:rgba(0,0,0,.78); --gbar:rgba(0,0,0,.78); --menu:rgba(44,44,46,.94);
    --shadow:0 12px 40px rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000; --group:#000; --card:#1c1c1e; --raised:#2c2c2e;
  --text:#fff; --text2:#98989f; --text3:#8d8d93; --text4:#48484a;
  --sep:rgba(84,84,88,.6); --fill:rgba(118,118,128,.24); --fill2:#1c1c1e;
  --accent:#D6B474; --on-accent:#1a1408; --tint:rgba(214,180,116,.18); --brand:#D9BA7C; --green:#30d158; --danger:#ff453a;
  --bar:rgba(0,0,0,.78); --gbar:rgba(0,0,0,.78); --menu:rgba(44,44,46,.94);
  --shadow:0 12px 40px rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{touch-action:manipulation}
body{font:17px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;letter-spacing:-.01em;overscroll-behavior-y:none}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
[hidden]{display:none!important}
svg{display:block}
.ico{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.solid{fill:currentColor;stroke:none}

/* ---------- lock ---------- */
#lock{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px;
  padding-top:max(24px,env(safe-area-inset-top));background:var(--group)}
.lock-in{width:100%;max-width:340px;text-align:center}
.lock-mark{width:76px;height:76px;margin:0 auto 22px;border-radius:18px;box-shadow:var(--shadow)}
.lock-in h1{font-size:28px;font-weight:700;margin:0 0 6px;letter-spacing:-.02em}
.lock-in p{color:var(--text2);margin:0 0 28px;font-size:15px}
.lock-field{display:block;width:100%;height:50px;border-radius:12px;border:0;background:var(--card);
  padding:0 16px;font-size:17px;text-align:center;outline:none;box-shadow:inset 0 0 0 .5px var(--sep)}
.lock-field:focus{box-shadow:inset 0 0 0 2px var(--accent)}
.btn-primary{display:block;width:100%;height:50px;margin-top:12px;border-radius:12px;background:var(--accent);
  color:var(--on-accent);font-weight:600;font-size:17px}
.btn-primary:disabled{opacity:.5}
.lock-err{color:var(--danger);font-size:14px;min-height:20px;margin-top:12px}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* ---------- directory ---------- */
.view{min-height:100dvh;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
/* Fixed, not sticky: iOS keeps a fixed bar on the compositor, so fast A–Z jumps can't make it flicker */
.view{padding-top:var(--hh)}
/* Solid, not frosted: it matches the status bar exactly (no gray seam) and has nothing to re-blur while scrolling.
   A hairline appears once the list scrolls under it. */
.bar{position:fixed;top:0;left:0;right:0;z-index:20;background:var(--bg);transform:translateZ(0);
  box-shadow:0 .5px 0 transparent;transition:box-shadow .2s;
  padding:calc(env(safe-area-inset-top) + 14px) 20px 10px}
/* title and ⋯ share one row: button centred on the title, right edge flush with the search field */
.titlerow{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;height:44px}
/* WOL wordmark as the title; it stays anchored at all times */
.brand{margin:0;line-height:0}
.mark{width:101px;height:44px;color:var(--brand)}
.bar.compact{box-shadow:0 .5px 0 var(--sep)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.circle{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--accent);background:var(--tint)}
.circle .ico{width:18px;height:18px}
.bar h1{margin:0;font-size:34px;font-weight:700;letter-spacing:-.025em;line-height:1.1}
.count{font-size:15px;color:var(--text2);margin-top:3px}
.search{display:block;position:relative;margin-top:10px}
.search .ico{position:absolute;left:9px;top:9px;width:18px;height:18px;color:var(--accent);stroke-width:2.2}
.search input{width:100%;height:36px;border:0;border-radius:10px;background:var(--fill);padding:0 32px 0 33px;
  font-size:17px;outline:none;-webkit-appearance:none}
.search input::placeholder{color:var(--text2)}
.search .clear{position:absolute;right:7px;top:8px;width:20px;height:20px;border-radius:50%;background:var(--text4);display:grid;place-items:center}
.search .clear .ico{position:static;width:11px;height:11px;color:var(--bg);stroke-width:3}

#list{padding-right:30px}
#list.noidx{padding-right:0}
/* Solid letter headers (no blur): 26 blurred sticky layers repaint and flash during fast scrolling */
.sh{position:sticky;top:var(--hh);z-index:5;margin:0;padding:14px 20px 5px;font-size:13px;font-weight:600;color:var(--text2);
  background:var(--bg);border-bottom:.5px solid var(--sep)}
.row{display:flex;align-items:center;padding-left:20px;cursor:pointer}
.row:active{background:var(--fill)}
.rb{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:10px 14px 10px 0;border-bottom:.5px solid var(--sep);min-height:62px}
.row:last-child .rb{border-bottom:0}
.main{flex:1;min-width:0}
.nm{font-size:17px;line-height:1.25}
.nm b{font-weight:600}
.sub{font-size:14px;color:var(--text3);margin-top:2px;line-height:1.3}
.empty{text-align:center;color:var(--text2);padding:60px 20px}
.foot{text-align:center;color:var(--text3);font-size:13px;padding:28px 0 8px}

/* A–Z strip: full height and 36px wide so a fingertip always lands on it. */
#idx{position:fixed;right:0;bottom:calc(env(safe-area-inset-bottom) + 8px);width:48px;z-index:25;display:flex;flex-direction:column;
  font-size:11px;font-weight:600;color:var(--accent);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
/* letters sit at the edge like Contacts; the touch area extends 48px in from it */
#idx span{flex:1 1 0;min-height:0;display:flex;align-items:center;justify-content:flex-end;padding-right:7px;line-height:1}
#idx:empty{display:none}
#bubble{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:80px;height:80px;border-radius:20px;
  background:var(--menu);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:var(--shadow);
  display:grid;place-items:center;font-size:40px;font-weight:600;z-index:40;pointer-events:none;opacity:0;transition:opacity .15s}
#bubble.on{opacity:1}

/* ---------- ⋯ menu ---------- */
#menuScrim{position:fixed;inset:0;z-index:60}
#menu{position:fixed;z-index:61;right:20px;top:calc(env(safe-area-inset-top) + 46px);width:230px;border-radius:14px;overflow:hidden;
  background:var(--menu);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);box-shadow:var(--shadow),0 0 0 .5px var(--sep);
  transform-origin:top right;transform:scale(.6);opacity:0;pointer-events:none;transition:transform .22s cubic-bezier(.32,.72,0,1),opacity .15s}
#menu.on{transform:none;opacity:1;pointer-events:auto}
#menu button{display:flex;width:100%;align-items:center;justify-content:space-between;padding:12px 16px;font-size:17px;text-align:left}
#menu button+button{border-top:.5px solid var(--sep)}
#menu button:active{background:var(--fill)}
#menu .ico{width:19px;height:19px}

/* ---------- pages ---------- */
.page{position:fixed;inset:0;z-index:45;background:var(--group);overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  transform:translateX(100%);transition:transform .4s cubic-bezier(.32,.72,0,1);padding-bottom:calc(32px + env(safe-area-inset-bottom))}
.page.up{transform:translateY(100%)}
.page.on{transform:none}
.nav{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(env(safe-area-inset-top) + 8px) 16px 8px;min-height:44px;background:var(--gbar);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
.nav .t{font-weight:600;font-size:17px;position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;max-width:50vw;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .2s}
.nav.titled .t{opacity:1}
.back{display:flex;align-items:center;gap:1px;color:var(--accent);font-size:17px;margin-left:-6px}
.back .ico{width:22px;height:22px;stroke-width:2.4}
.link{color:var(--accent);font-size:17px}
.link.b{font-weight:600}
.link:disabled{opacity:.4}
.wrap{max-width:640px;margin:0 auto}
.big{padding:6px 20px 0}
.big h1{margin:0;font-size:34px;font-weight:700;letter-spacing:-.025em;line-height:1.12}
.big .count{margin-top:4px}
.grp{background:var(--card);border-radius:12px;overflow:hidden;margin:0 16px}
.cell{position:relative;display:flex;align-items:center;gap:12px;padding:11px 16px;min-height:48px;width:100%;text-align:left}
.cell+.cell::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.cell:active{background:var(--fill)}
.cell .l{flex:1;min-width:0}
.cell .k{font-size:13px;color:var(--text2)}
.cell .v{font-size:17px;color:var(--accent);margin-top:1px}
.cell .v.plain{color:var(--text)}
.chev{color:var(--text4);width:15px!important;height:15px!important;stroke-width:2.6!important;flex:none}
.label{font-size:13px;color:var(--text2);text-transform:uppercase;letter-spacing:.02em;margin:24px 32px 7px}
.note{font-size:13px;color:var(--text3);margin:8px 32px 0;line-height:1.4}

/* person */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:14px 24px 24px}
.avatar{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:38px;font-weight:500;letter-spacing:0;
  background:linear-gradient(180deg,#b4b8c1,#8e929b)}
.hero h1{margin:16px 0 0;font-size:28px;font-weight:700;letter-spacing:-.025em;line-height:1.15}
.hero .formal{margin-top:4px;font-size:16px;color:var(--text2)}
.acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 16px}
.act{height:62px;border-radius:12px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;color:var(--accent)}
.act .ico{width:22px;height:22px}
.act:active{opacity:.6}
.act.off{color:var(--text4);pointer-events:none}
.addr{display:flex;align-items:center;gap:12px;padding:11px 12px 11px 16px}
.minimap{flex:none;width:64px;height:64px;border-radius:10px;background:#e7edf2;position:relative;overflow:hidden}
:root[data-theme="dark"] .minimap{background:#2a2f36}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .minimap{background:#2a2f36}}
.minimap i{position:absolute;background:var(--card);opacity:.95}
.minimap i:nth-child(1){left:-10px;top:26px;width:90px;height:7px;transform:rotate(-18deg)}
.minimap i:nth-child(2){left:30px;top:-10px;width:6px;height:90px}
.minimap b{position:absolute;left:24px;top:22px;width:16px;height:16px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-sizing:border-box}

/* route planner */
.prog{margin:16px 20px 0;height:4px;border-radius:2px;background:var(--fill);overflow:hidden}
.prog i{display:block;height:100%;background:var(--green)}
.go{margin:18px 16px 0;height:52px;border-radius:14px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;gap:8px;font-size:17px;font-weight:600;padding:0 16px;text-align:center}
.go .ico{width:18px;height:18px}
.upnext{margin:16px 16px 0;padding:16px}
.upnext .go{margin:14px 0 0}
.un-k{font-size:13px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.03em}
.un-name{display:block;text-align:left;margin-top:6px;font-size:20px;line-height:1.25;letter-spacing:-.015em}
.un-name b{font-weight:700}
.un-addr{font-size:15px;color:var(--text2);margin-top:3px}
.un-row{display:flex;gap:10px;margin-top:10px}
.un-btn{flex:1;height:44px;border-radius:12px;background:var(--fill);color:var(--accent);display:flex;align-items:center;justify-content:center;gap:6px;font-size:16px;font-weight:500}
.un-btn .ico{width:16px;height:16px}
.un-btn:active{opacity:.6}
.upnext.alldone{text-align:center}
.upnext.alldone .un-k{color:var(--green);font-size:15px;margin-bottom:12px}
.go:active{opacity:.75}
.stop{display:flex;align-items:center;gap:12px;padding-left:14px}
.stop .rb{min-height:60px;padding-right:12px}
.stop:last-child .rb{border-bottom:0}
.num{position:relative;flex:none;width:26px;height:26px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--text4);display:grid;place-items:center;
  font-size:13px;font-weight:600;color:var(--text2);font-variant-numeric:tabular-nums}
.num .ico{width:14px;height:14px;stroke-width:3;color:#fff}
.num::after{content:"";position:absolute;inset:-9px}
.stop.done .num{background:var(--green);box-shadow:none}
.stop.next .num{box-shadow:inset 0 0 0 1.5px var(--accent);color:var(--accent)}
.stop.done .main{opacity:.4}
.stop .main{cursor:pointer}
.navbtn{flex:none;width:32px;height:32px;border-radius:50%;background:var(--fill);color:var(--accent);display:grid;place-items:center}
.navbtn .ico{width:15px;height:15px}
.flag{color:#ff9500}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:22px 16px 0}
.btns button{height:44px;border-radius:12px;background:var(--card);color:var(--accent);font-size:16px}
.btns button.danger{color:var(--danger)}
.rrow{display:flex;align-items:center;gap:12px}
.rrow .main{flex:1}
.blank{text-align:center;padding:70px 36px}
.blank>.ico{width:44px;height:44px;margin:0 auto 14px;color:var(--text4);stroke-width:1.5}
.blank h2{margin:0 0 8px;font-size:22px;letter-spacing:-.02em}
.blank p{margin:0 0 22px;color:var(--text2);font-size:15px;line-height:1.45}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:46px;padding:0 24px 0 20px;border-radius:23px;background:var(--accent);color:var(--on-accent);font-size:17px;font-weight:600}
.pill .ico{width:17px;height:17px;stroke-width:2.6;flex:none}

/* builder */
.field{width:100%;height:46px;border:0;background:transparent;padding:0 16px;font-size:17px;outline:none}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px;margin:0 16px}
.seg button{flex:1;height:32px;border-radius:7px;font-size:14px;font-weight:500}
.seg button.on{background:var(--raised);box-shadow:0 2px 6px rgba(0,0,0,.12)}
:root[data-theme="dark"] .seg button.on{background:#636366}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button.on{background:#636366}}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:48px}
.switch{width:51px;height:31px;border-radius:16px;background:var(--fill);position:relative;transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .2s}
.switch.on{background:var(--green)}
.switch.on::after{transform:translateX(20px)}
.picked{display:flex;justify-content:space-between;align-items:baseline;margin:24px 32px 7px;font-size:13px;color:var(--text2)}
.picked b{color:var(--text);font-weight:600}
.bsearch{position:sticky;top:calc(env(safe-area-inset-top) + 52px);z-index:4;background:var(--group);padding:6px 16px 8px}
.bsearch .search{margin:0}
.bsearch .search input{background:var(--card)}
.blist{background:var(--card);border-radius:12px;overflow:hidden;margin:0 16px}
.blist .sh{position:static;background:var(--card);padding-left:16px}
.blist .row{padding-left:16px}
.chk{flex:none;width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--text4);display:grid;place-items:center}
.chk .ico{width:14px;height:14px;color:var(--on-accent);stroke-width:3;opacity:0}
.row.sel .chk{background:var(--accent);box-shadow:none}
.row.sel .chk .ico{opacity:1}

/* ---------- sheet (settings) ---------- */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:50;opacity:0;pointer-events:none;transition:opacity .28s}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-height:90dvh;overflow:auto;overscroll-behavior:contain;background:var(--group);
  border-radius:14px 14px 0 0;transform:translateY(105%);transition:transform .34s cubic-bezier(.32,.72,0,1);
  padding:8px 0 calc(28px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
:root[data-theme="dark"] #sheet{background:#1c1c1e}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) #sheet{background:#1c1c1e}}
#sheet .grp{background:var(--raised)}
#sheet.on{transform:none}
.grab{width:36px;height:5px;border-radius:3px;background:var(--text4);margin:0 auto 6px}
.sheet-top{display:flex;justify-content:space-between;align-items:center;padding:4px 20px 0}
.sheet-top h2{margin:0;font-size:20px;font-weight:700;letter-spacing:-.02em}
#sheet .label{margin-left:32px}

.toast{position:fixed;left:50%;bottom:calc(40px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:70;
  background:rgba(30,30,32,.92);color:#fff;font-size:15px;padding:10px 18px;border-radius:20px;opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (min-width:700px){#list{max-width:720px;margin:0 auto}.bar>*{max-width:680px;margin-left:auto;margin-right:auto}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>

/* ---------------- crypto ---------------- */
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64e = b => btoa(String.fromCharCode(...new Uint8Array(b)));
async function deriveKey(pass){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:b64d(PAYLOAD.salt), iterations:PAYLOAD.iter, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, true, ['decrypt']);
}
async function decryptWith(key){
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(PAYLOAD.iv)}, key, b64d(PAYLOAD.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function tryStoredKey(){
  const raw = store.get('key');
  if(!raw) return null;
  try{
    const key = await crypto.subtle.importKey('raw', b64d(raw), {name:'AES-GCM'}, false, ['decrypt']);
    return await decryptWith(key);
  }catch{ store.del('key'); return null; }
}

/* ---------------- data ---------------- */
let D = [];
function telOf(num){
  const d = num.replace(/\D/g, '');
  if(d.startsWith('0')) return '+972' + d.slice(1);
  if(d.length === 10) return '+1' + d;
  return d;
}
const fmtPhone = n => { const d = n.replace(/\D/g, ''); return d.length === 10 && !d.startsWith('0') ? `(${d.slice(0, 3)}) ${d.slice(3, 6)}-${d.slice(6)}` : n; };
function parsePhones(raw){
  if(!raw) return [];
  return raw.split(/,\s*/).map(p => {
    const m = p.match(/^([A-Za-z][A-Za-z.]*?)\.?\s*(\d[\d\- ]+\d)$/);
    const label = m ? m[1].replace(/\.$/, '') : '';
    const num = (m ? m[2] : p).trim();
    return {label, num, tel: telOf(num)};
  });
}
// "Mr. Chanan & Mrs. Gelah" -> "Chanan & Gelah"; keeps Rabbi / Dr. / Honorable.
const casual = rest => rest.replace(/\b(Mr|Mrs|Ms|Miss)\.\s*/g, '').replace(/\s+/g, ' ').trim();
// First names only, for the person page title.
function firstNames(rest){
  const widow = rest.match(/^Mrs\.\s+[^()]+\(([^()]+)\)\s*$/);
  if(widow) return widow[1].trim();
  return casual(rest).replace(/\b(Rabbi|Dr|Rebbetzin|Honorable|Cantor|Rav|Reb)\.?\s+/g, '').replace(/\s+/g, ' ').trim();
}
function prep(rows){
  D = rows.map((r, i) => {
    const [name, phone, address, city, lat, lng, approx] = r;
    const k = name.indexOf(',');
    const sur = (k > 0 ? name.slice(0, k) : name).trim();
    const rest = (k > 0 ? name.slice(k + 1) : '').trim();
    const first = firstNames(rest);
    const firsts = first.split(/\s*&\s*/).map(s => s.split(/\s+/)[0].replace(/[()]/g, ''));
    const phones = parsePhones(phone).map(p => {
      if(!p.label) return p;
      const hits = firsts.filter(f => f && f[0].toUpperCase() === p.label[0].toUpperCase());
      return hits.length === 1 ? {...p, label: hits[0]} : p;
    });
    const short = city.replace(/,\s*MI\s*\d{5}$/, '').replace(/\s+\d{5}$/, '');
    const letter = (sur.match(/[A-Za-z]/) || ['#'])[0].toUpperCase();
    return {i, name, sur, rest, given: casual(rest), title: first ? `${first} ${sur}` : sur,
      phone, phones, address, city, short, letter, ll: lat == null ? null : [lat, lng], approx: !!approx,
      hay: (name + ' ' + address + ' ' + city + ' ' + phone.replace(/\D/g, '')).toLowerCase()};
  });
}
const mapQuery = p => (p.address ? p.address.replace(/,?\s*(Apt\.?|Unit|Suite)\s*#?.*$/i, '') + ', ' : '') + p.city;
function mapURL(p, directions){
  const q = mapQuery(p);
  if(settings.maps === 'google') return directions
    ? `https://www.google.com/maps/dir/?api=1&destination=${enc(q)}&travelmode=driving`
    : `https://www.google.com/maps/search/?api=1&query=${enc(q)}`;
  if(settings.maps === 'waze') return p.ll
    ? `https://waze.com/ul?ll=${p.ll[0]},${p.ll[1]}${directions ? '&navigate=yes' : ''}`
    : `https://waze.com/ul?q=${enc(q)}${directions ? '&navigate=yes' : ''}`;
  return directions ? `https://maps.apple.com/?daddr=${enc(q)}&dirflg=d` : `https://maps.apple.com/?q=${enc(q)}`;
}
const initials = p => ((p.title.match(/[A-Z]/) || [''])[0] + (p.sur.match(/[A-Z]/) || [''])[0]);

/* ---------------- directory ---------------- */
function matches(q){
  const t = q.toLowerCase().split(/\s+/).filter(Boolean).map(s => s.replace(/[()\-]/g, '') || s);
  if(!t.length) return D;
  return D.filter(p => t.every(w => p.hay.includes(w)));
}
function rowHTML(p, mode){
  // The whole row opens the person's card; calling and maps live there.
  const right = mode === 'pick' ? `<span class="chk">${icon('check')}</span>` : '';
  const where = (p.address ? esc(p.address) + ' · ' : '') + esc(p.short);
  return `<div class="row" role="button" data-i="${p.i}"><div class="rb"><div class="main"><div class="nm"><b>${esc(p.sur)}</b> ${esc(p.given)}</div>
    <div class="sub">${where}</div></div>${right}</div></div>`;
}
function listHTML(items, mode, selected){
  if(!items.length) return `<div class="empty">No matches</div>`;
  let html = '', cur = null;
  for(const p of items){
    if(p.letter !== cur){
      if(cur !== null) html += '</section>';
      cur = p.letter;
      html += `<section id="${mode}-${cur}"><h2 class="sh">${cur}</h2>`;
    }
    let r = rowHTML(p, mode);
    if(selected && selected.has(p.i)) r = r.replace('class="row"', 'class="row sel"');
    html += r;
  }
  return html + '</section>';
}
function renderPeople(){
  const q = $('#q').value.trim();
  $('#qClear').hidden = !q;
  const items = matches(q);
  $('#list').innerHTML = listHTML(items, 'L');
  $('#list').classList.toggle('noidx', !!q);
  $('#idx').innerHTML = q ? '' : [...new Set(items.map(p => p.letter))].map(l => `<span>${l}</span>`).join('');
  placeIdx();
}
function placeIdx(){
  const idx = $('#idx'), hh = $('#peopleBar').offsetHeight;
  document.documentElement.style.setProperty('--hh', hh + 'px');
  idx.style.top = (hh + 8) + 'px';
  const n = idx.children.length || 1;
  idx.style.fontSize = Math.max(9, Math.min(12, idx.offsetHeight / n - 4)) + 'px';
}
function jumpTo(letter){
  const el = document.getElementById('L-' + letter);
  if(el) scrollTo(0, el.getBoundingClientRect().top + scrollY - $('#peopleBar').offsetHeight + 1);
}
let scrubbing = false;
(function idxScrub(){
  // Listens on the whole document (capture phase) and claims any touch that starts in the
  // strip's area, so a touch is never lost to whatever element happens to be under the finger.
  // While scrubbing the page is frozen (overflow hidden), which also kills leftover momentum;
  // otherwise iOS ignores the jump while the list is still coasting.
  const idx = $('#idx'), bubble = $('#bubble'), se = document.scrollingElement;
  let last = null, active = false;
  const covered = () => document.querySelector('.page.on, #sheet.on, #menu.on') || $('#app').hidden || !idx.children.length;
  const inStrip = (x, y) => { const r = idx.getBoundingClientRect(); return x >= r.left && y >= r.top - 12 && y <= r.bottom + 12; };
  const at = y => {
    const r = idx.getBoundingClientRect(), kids = idx.children;
    const k = Math.floor((Math.min(Math.max(y, r.top), r.bottom - 1) - r.top) / r.height * kids.length);
    const l = kids[Math.max(0, Math.min(kids.length - 1, k))].textContent;
    if(l !== last){ last = l; jumpTo(l); bubble.textContent = l; bubble.classList.add('on'); }
  };
  const begin = y => { active = scrubbing = true; last = null; se.style.overflow = 'hidden'; at(y); };
  const end = () => { if(!active) return; active = scrubbing = false; last = null; se.style.overflow = ''; bubble.classList.remove('on'); syncBar(); };
  document.addEventListener('touchstart', e => {
    if(e.touches.length !== 1 || covered()) return;
    const t = e.touches[0];
    if(!inStrip(t.clientX, t.clientY)) return;
    e.preventDefault(); begin(t.clientY);
  }, {capture: true, passive: false});
  document.addEventListener('touchmove', e => { if(active){ e.preventDefault(); at(e.touches[0].clientY); } }, {capture: true, passive: false});
  document.addEventListener('touchend', end, true);
  document.addEventListener('touchcancel', end, true);
  idx.addEventListener('mousedown', e => {
    e.preventDefault(); begin(e.clientY);
    const mv = ev => at(ev.clientY);
    addEventListener('mousemove', mv);
    addEventListener('mouseup', () => { removeEventListener('mousemove', mv); end(); }, {once:true});
  });
})();

// The slide-in waits one frame so the transition runs; closing cancels a slide-in still pending.
function openPage(id){ const pg = $(id); pg.scrollTop = 0; pg.dataset.opening = '1'; requestAnimationFrame(() => { if(pg.dataset.opening){ pg.classList.add('on'); syncChrome(); } }); }
function closePage(id){ const pg = typeof id === 'string' ? $(id) : id; delete pg.dataset.opening; pg.classList.remove('on'); syncChrome(); }
// Fade the small centred title in once the large title scrolls away.
document.querySelectorAll('.page').forEach(pg => pg.addEventListener('scroll', () => {
  const n = pg.querySelector('.nav'); if(n) n.classList.toggle('titled', pg.scrollTop > 44);
}, {passive:true}));
const navHTML = (backLabel, title, right = '') =>
  `<div class="nav"><button class="back" data-back>${icon('back')}${esc(backLabel)}</button><div class="t">${esc(title)}</div><div>${right}</div></div>`;
document.addEventListener('click', e => {
  const b = e.target.closest('[data-back]');
  if(b) closePage('#' + b.closest('.page').id);
});
// Swipe from the left edge to go back, like any iPhone app (pushed pages only, not the New Route sheet).
(function edgeSwipe(){
  let sw = null;
  document.addEventListener('touchstart', e => {
    const t = e.touches[0];
    if(e.touches.length !== 1 || t.clientX > 24) return;
    const open = [...document.querySelectorAll('.page.on:not(.up)')];
    if(!open.length || $('#sheet.on')) return;
    sw = {pg: open[open.length - 1], x0: t.clientX, y0: t.clientY, dx: 0, live: false};
  }, {passive: true});
  document.addEventListener('touchmove', e => {
    if(!sw) return;
    const t = e.touches[0], dx = t.clientX - sw.x0, dy = t.clientY - sw.y0;
    if(!sw.live){
      if(Math.abs(dy) > Math.abs(dx)){ sw = null; return; }
      if(dx < 8) return;
      sw.live = true; sw.pg.style.transition = 'none';
    }
    e.preventDefault();
    sw.dx = Math.max(0, dx);
    sw.pg.style.transform = `translateX(${sw.dx}px)`;
  }, {passive: false});
  const end = () => {
    if(!sw) return;
    const {pg, dx, live} = sw; sw = null;
    if(!live) return;
    pg.style.transition = '';
    pg.style.transform = '';
    if(dx > innerWidth * 0.3) closePage(pg);
  };
  document.addEventListener('touchend', end);
  document.addEventListener('touchcancel', end);
})();

/* ---------------- add to the phone's Contacts ---------------- */
// Builds a vCard; iOS opens it in its own "New Contact" screen, pre-filled.
const vEsc = v => String(v ?? '').replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/([,;])/g, '\\$1');
function vcard(p){
  const first = p.title.endsWith(' ' + p.sur) ? p.title.slice(0, -p.sur.length - 1) : p.title;
  const lines = ['BEGIN:VCARD', 'VERSION:3.0',
    `N:${vEsc(p.sur)};${vEsc(first)};;;`, `FN:${vEsc(p.title)}`];
  p.phones.forEach((x, k) => {
    lines.push(`item${k + 1}.TEL;TYPE=VOICE:${x.tel}`);
    if(x.label) lines.push(`item${k + 1}.X-ABLabel:${vEsc(x.label)}`);
  });
  if(p.address || p.city){
    // "Southfield, MI 48075" -> locality / region / zip; anything else (e.g. Israel) goes in as locality.
    const m = p.city.match(/^(.*?),\s*([A-Z]{2})\s*(\d{5})?$/);
    const country = /Israel/.test(p.city) ? 'Israel' : m ? 'USA' : '';
    const il = p.city.match(/^(.*?),?\s*(\d{5,7})?\s*Israel$/);
    const adr = m ? [m[1], m[2], m[3] || ''] : il ? [il[1], '', il[2] || ''] : [p.city, '', ''];
    lines.push(`ADR;TYPE=HOME:;;${vEsc(p.address)};${vEsc(adr[0])};${vEsc(adr[1])};${vEsc(adr[2])};${country}`);
  }
  lines.push(`NOTE:${vEsc(p.rest)} · WOL directory`, 'END:VCARD');
  return lines.join('\r\n') + '\r\n';
}
$('#person').addEventListener('click', e => {

  const p = D[+b.dataset.i];

});

/* ---------------- routing math ---------------- */
// Oak Park / Southfield sit on a north–south / east–west mile-road grid, so driving distance is
// much closer to the distance along the grid (east–west + north–south) than to a straight line.
const MI_PER_DEG = 69.05;
function gridMiles(a, b){
  const dy = (b[0] - a[0]) * MI_PER_DEG;
  const dx = (b[1] - a[1]) * MI_PER_DEG * Math.cos((a[0] + b[0]) * Math.PI / 360);
  return Math.abs(dx) + Math.abs(dy);
}
const ROAD_FACTOR = 1.08, AVG_MPH = 20;

// Orders pts to minimise driving distance. start / end: optional fixed [lat,lng] endpoints
// (end = come back home). Nearest-neighbour seeds, then 2-opt and or-opt (moving runs of 1–3
// stops, either way round), then a short iterated search that perturbs and re-improves.
// Returns the indexes of pts in visiting order.
function optimize(pts, start, end){
  const n = pts.length;
  if(n < 2) return pts.map((_, i) => i);
  const nodes = [...(start ? [start] : []), ...pts, ...(end ? [end] : [])];
  const off = start ? 1 : 0, N = nodes.length, lo = off, hi = off + n - 1;
  const M = new Float64Array(N * N);
  for(let i = 0; i < N; i++) for(let j = i + 1; j < N; j++) M[i * N + j] = M[j * N + i] = gridMiles(nodes[i], nodes[j]);
  const d = (a, b) => (a < 0 || b < 0) ? 0 : M[a * N + b];
  const at = (t, k) => (k >= 0 && k < N) ? t[k] : -1;
  const cost = t => { let s = 0; for(let k = 1; k < N; k++) s += M[t[k - 1] * N + t[k]]; return s; };

  const nn = seed => {
    const used = new Uint8Array(N), t = [];
    if(start){ t.push(0); used[0] = 1; }
    if(end) used[N - 1] = 1;
    let cur = start ? 0 : seed;
    if(!start){ t.push(seed); used[seed] = 1; }
    while(t.length < (start ? 1 : 0) + n){
      let best = -1, bd = Infinity;
      for(let j = lo; j <= hi; j++) if(!used[j] && M[cur * N + j] < bd){ bd = M[cur * N + j]; best = j; }
      t.push(best); used[best] = 1; cur = best;
    }
    if(end) t.push(N - 1);
    return t;
  };
  const twoOpt = t => {
    let improved = false;
    for(let i = lo; i < hi; i++) for(let j = i + 1; j <= hi; j++){
      const a = at(t, i - 1), b = t[i], c = t[j], e = at(t, j + 1);
      if(d(a, c) + d(b, e) < d(a, b) + d(c, e) - 1e-9){
        for(let x = i, y = j; x < y; x++, y--){ const tmp = t[x]; t[x] = t[y]; t[y] = tmp; }
        improved = true;
      }
    }
    return improved;
  };
  const orOpt = t => {
    for(let L = 1; L <= 3; L++) for(let i = lo; i + L - 1 <= hi; i++){
      const s0 = t[i], sL = t[i + L - 1], prev = at(t, i - 1), next = at(t, i + L);
      const gain = d(prev, s0) + d(sL, next) - d(prev, next);
      // insert between t[p] and t[p+1]; p = lo-1 is "before the first stop", p = hi is "after the last"
      for(let p = lo - 1; p <= hi; p++){
        if(p >= i - 1 && p <= i + L - 1) continue;
        const x = at(t, p), y = at(t, p + 1);
        const base = d(x, y);
        const fwd = d(x, s0) + d(sL, y) - base, rev = d(x, sL) + d(s0, y) - base;
        const add = Math.min(fwd, rev);
        if(add < gain - 1e-9){
          const seg = t.splice(i, L);
          if(rev < fwd) seg.reverse();
          const ins = p < i ? p + 1 : p + 1 - L;
          t.splice(ins, 0, ...seg);
          return true;
        }
      }
    }
    return false;
  };
  const local = t => { for(let k = 0; k < 100; k++){ const a = twoOpt(t), b = orOpt(t); if(!a && !b) break; } return t; };

  let best = null, bestC = Infinity;
  const seeds = start ? [0] : Array.from({length: Math.min(n, n > 60 ? 8 : 20)}, (_, k) => lo + Math.floor(k * n / Math.min(n, n > 60 ? 8 : 20)));
  for(const s of seeds){ const t = local(nn(s)); const c = cost(t); if(c < bestC){ bestC = c; best = t; } }
  // Iterated local search: shuffle a slice of the best route, re-improve, keep it if shorter.
  if(n >= 6){
    const budget = Math.min(700, 120 + n * 4), t0 = performance.now();
    while(performance.now() - t0 < budget){
      const t = best.slice();
      const a = lo + Math.floor(Math.random() * (n - 2)), b = a + 2 + Math.floor(Math.random() * Math.min(8, hi - a - 1));
      const part = t.slice(a, b + 1);
      for(let k = part.length - 1; k > 0; k--){ const r = Math.floor(Math.random() * (k + 1)); [part[k], part[r]] = [part[r], part[k]]; }
      t.splice(a, part.length, ...part);
      local(t);
      const c = cost(t);
      if(c < bestC - 1e-9){ bestC = c; best = t; }
    }
  }
  return best.slice(lo, hi + 1).map(x => x - off);
}

/* ---------------- route storage ---------------- */
// Routes are saved by a stable key per family (from name + address), never by list position,
// so they survive the directory being corrected or re-ordered.
let routes = [];
const KEY = new Map();
function keyOf(p){
  let h = 2166136261;
  for(const ch of p.name + '|' + p.address + '|' + p.city){ h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
  return (h >>> 0).toString(36);
}
function indexKeys(){
  KEY.clear();
  for(const p of D){ let k = keyOf(p); while(KEY.has(k)) k += '~'; p.key = k; KEY.set(k, p.i); }
}
const toKeys = ids => ids.map(i => D[i] && D[i].key).filter(Boolean);
const fromKeys = ks => ks.map(k => KEY.get(k)).filter(i => i !== undefined);
function loadRoutes(){
  const saved = store.get('routes2', null);
  if(saved) routes = saved.map(r => ({...r, ids: fromKeys(r.ids), done: fromKeys(r.done)}));
  else {
    // one-time move from the old format, which stored list positions
    routes = store.get('routes', []).map(r => ({...r, ids: r.ids.filter(i => D[i]), done: (r.done || []).filter(i => D[i])}));
    saveRoutes(); store.del('routes');
  }
}
const saveRoutes = () => store.set('routes2', routes.map(r => ({...r, ids: toKeys(r.ids), done: toKeys(r.done)})));

/* ---------------- planning ---------------- */
function routeStats(r, from){
  const ids = r.ids.filter(i => D[i].ll && (!from || !r.done.includes(i)));
  let mi = 0, prev = from || r.start || null;
  for(const i of ids){ if(prev) mi += gridMiles(prev, D[i].ll); prev = D[i].ll; }
  if(r.ret && r.start && prev) mi += gridMiles(prev, r.start);
  const road = mi * ROAD_FACTOR;
  return {miles: road, mins: Math.max(1, Math.round(road / AVG_MPH * 60))};
}
// Visited stops stay first, in the order they were done; the rest are re-planned from `from`
// (where you are now), ending back home when the route is a round trip.
function plan(r, from){
  const finished = r.ids.filter(i => r.done.includes(i));
  const pending = r.ids.filter(i => !r.done.includes(i));
  const withLL = pending.filter(i => D[i].ll), without = pending.filter(i => !D[i].ll);
  const ord = optimize(withLL.map(i => D[i].ll), from || null, r.ret && r.start ? r.start : null);
  r.ids = [...finished, ...ord.map(k => withLL[k]), ...without];
}
// Best guess of where you are: live location, else the last stop you finished, else the route's start.
async function whereNow(r, live){
  if(live){ const s = await here().catch(() => null); if(s) return s; }
  const last = [...r.ids].reverse().find(i => r.done.includes(i) && D[i].ll);
  return last !== undefined ? D[last].ll : r.start || null;
}

/* ---------------- route planner ---------------- */
const fmtMi = m => m < 10 ? m.toFixed(1) : Math.round(m);
const fmtMin = m => m < 60 ? `${m} min` : `${Math.floor(m / 60)} hr${m % 60 ? ' ' + (m % 60) + ' min' : ''}`;

function openRoutes(){ renderRoutes(); openPage('#routesPage'); }
function renderRoutes(){
  const pg = $('#routesPage');
  const keep = pg.scrollTop;
  const body = routes.length
    ? `<div class="grp" style="margin-top:18px">${routes.map(r => {
        const s = routeStats(r), n = r.ids.length, done = r.done.length;
        const state = done === n && n ? 'All done' : done ? `${done} of ${n} done` : `${n} stop${n === 1 ? '' : 's'}`;
        return `<button class="cell" data-route="${r.id}"><div class="l"><div class="v plain" style="font-weight:600">${esc(r.name)}</div>
          <div class="k" style="margin-top:2px">${state} · ${fmtMi(s.miles)} mi</div>
          ${done ? `<div class="prog" style="margin:8px 0 2px"><i style="width:${done / n * 100}%"></i></div>` : ''}</div>${icon('chev', 'ico chev')}</button>`;
      }).join('')}</div>`
    : `<div class="blank">${icon('route')}<h2>No routes yet</h2><p>Pick families from the directory and get every stop in the shortest order.</p>
        <button class="pill" data-newroute>${icon('plus')}New Route</button></div>`;
  pg.innerHTML = navHTML('Directory', 'Route Planner', `<button class="link" data-newroute>New</button>`) +
    `<div class="wrap"><div class="big"><h1>Route Planner</h1></div>${body}</div>`;
  pg.scrollTop = keep;
}
$('#routesPage').addEventListener('click', e => {
  if(e.target.closest('[data-newroute]')){ openBuilder(); return; }
  const c = e.target.closest('[data-route]'); if(c) showRoute(c.dataset.route);
});

// Google Maps links take up to 9 waypoints, so it gets the next 10 stops as one trip.
// Apple Maps and Waze links take a single destination, so they get the next stop.
function nextLeg(r){
  const left = r.ids.filter(i => !r.done.includes(i) && (D[i].address || D[i].ll));
  if(!left.length) return null;
  const next = left[0];
  if(settings.maps !== 'google') return {url: mapURL(D[next], true), label: `Directions in ${MAPS_NAME[settings.maps]}`, next};
  const legs = left.slice(0, 10), dest = legs[legs.length - 1], way = legs.slice(0, -1);
  let url = `https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=${enc(mapQuery(D[dest]))}`;
  if(way.length) url += `&waypoints=${way.map(i => enc(mapQuery(D[i]))).join('%7C')}`;
  return {url, label: legs.length > 1 ? `Google Maps · next ${legs.length} stops` : 'Directions in Google Maps', next};
}
let RV = null;
function showRoute(id, inPlace){
  const r = routes.find(x => x.id === id);
  if(!r) return;
  RV = id;
  const pg = $('#routeView'), keep = pg.scrollTop;
  const n = r.ids.length, done = r.done.length, leg = nextLeg(r), s = routeStats(r);
  const left = done ? routeStats(r, (() => { const l = [...r.ids].reverse().find(i => r.done.includes(i) && D[i].ll); return l !== undefined ? D[l].ll : null; })()) : s;
  const summary = done
    ? `${done} of ${n} done · ${fmtMi(left.miles)} mi left · about ${fmtMin(left.mins)}`
    : `${n} stop${n === 1 ? '' : 's'} · ${fmtMi(s.miles)} mi · about ${fmtMin(s.mins)} driving`;
  let upnext = '';
  if(leg){
    const p = D[leg.next], ph = p.phones[0], k = r.ids.indexOf(leg.next) + 1;
    upnext = `<div class="grp upnext">
      <div class="un-k">Up next · Stop ${k} of ${n}</div>
      <button class="un-name" data-person="${leg.next}"><b>${esc(p.sur)}</b> ${esc(p.given)}</button>
      <div class="un-addr">${esc(p.address || '')}${p.address ? ' · ' : ''}${esc(p.short)}</div>
      <a class="go" href="${leg.url}" target="_blank" rel="noopener">${icon('nav')}${esc(leg.label)}</a>
      <div class="un-row">
        ${ph ? `<a class="un-btn" href="tel:${ph.tel}">${icon('phone')}Call</a>` : ''}
        <button class="un-btn" data-toggle="${leg.next}">${icon('check')}Done, next stop</button>
      </div></div>`;
  } else if(n){
    upnext = `<div class="grp upnext alldone"><div class="un-k">All ${n} stops done</div><button class="un-btn" id="rvReset2">Start over</button></div>`;
  }
  const stops = r.ids.map((i, k) => {
    const p = D[i], isDone = r.done.includes(i);
    const cls = isDone ? 'done' : leg && leg.next === i ? 'next' : '';
    const where = (p.address ? esc(p.address) + ' · ' : '') + esc(p.short) +
      (p.ll ? (p.approx ? ' <span class="flag">· approx.</span>' : '') : ' <span class="flag">· not on map, placed last</span>');
    return `<div class="stop ${cls}"><button class="num" data-toggle="${i}" aria-label="${isDone ? 'Undo' : 'Mark'} stop ${k + 1} ${isDone ? '' : 'done'}">${isDone ? icon('check') : k + 1}</button>
      <div class="rb"><div class="main" data-person="${i}"><div class="nm"><b>${esc(p.sur)}</b> ${esc(p.given)}</div><div class="sub">${where}</div></div>
      <a class="navbtn" href="${mapURL(p, true)}" target="_blank" rel="noopener" aria-label="Directions to ${esc(p.sur)}">${icon('nav')}</a></div></div>`;
  }).join('');
  const startLabel = r.start ? (r.ret ? 'From your location · back home at the end' : 'From your location') : 'Shortest order';
  pg.innerHTML = navHTML('Routes', r.name, `<button class="link" id="rvShare" aria-label="Share route">${icon('share')}</button>`) + `<div class="wrap">
    <div class="big"><h1>${esc(r.name)}</h1><div class="count">${summary}</div></div>
    <div class="prog"><i style="width:${n ? done / n * 100 : 0}%"></i></div>
    ${upnext}
    <div class="label">${startLabel}</div>
    <div class="grp">${stops}</div>
    <div class="note">Tap a number to mark it done or undo it.</div>
    <div class="btns"><button id="rvEdit">Edit Stops</button><button id="rvReopt">Re-optimize from Here</button></div>
    <div class="btns" style="margin-top:10px"><button id="rvReset">Clear Progress</button><button class="danger" id="rvDel">Delete Route</button></div>
  </div>`;
  if(inPlace) pg.scrollTop = keep; else openPage('#routeView');
}
$('#routeView').addEventListener('click', async e => {
  const r = routes.find(x => x.id === RV);
  if(!r) return;
  const tg = e.target.closest('[data-toggle]');
  if(tg){
    const i = +tg.dataset.toggle, wasDone = r.done.includes(i);
    r.done = wasDone ? r.done.filter(x => x !== i) : [...r.done, i];
    if(!wasDone){ // keep finished stops in the order they were actually visited
      r.ids = [...r.ids.filter(x => r.done.includes(x) && x !== i), i, ...r.ids.filter(x => !r.done.includes(x))];
      if(r.done.length === r.ids.length) toast('Route complete');
    }
    saveRoutes(); showRoute(r.id, true); renderRoutes(); return;
  }
  const pp = e.target.closest('[data-person]');
  if(pp){ showPerson(+pp.dataset.person); return; }
  if(e.target.closest('#rvEdit')){ openBuilder(r); return; }
  if(e.target.closest('#rvReopt')){
    const btn = e.target.closest('#rvReopt'); btn.disabled = true; btn.textContent = 'Finding you…';
    const from = await whereNow(r, true);
    await new Promise(res => setTimeout(res, 20));
    plan(r, from); saveRoutes(); showRoute(r.id, true); renderRoutes(); toast('Re-optimized from here'); return;
  }
  if(e.target.closest('#rvReset, #rvReset2')){ r.done = []; saveRoutes(); showRoute(r.id, true); renderRoutes(); return; }
  if(e.target.closest('#rvDel')){
    if(!confirm(`Delete “${r.name}”?`)) return;
    routes = routes.filter(x => x.id !== r.id); saveRoutes(); renderRoutes(); closePage('#routeView'); return;
  }
  if(e.target.closest('#rvShare')) shareRoute(r);
});

/* builder */
let B = null;
function openBuilder(existing, preselect){
  B = existing
    ? {id: existing.id, name: existing.name, sel: new Set(existing.ids), startMode: existing.start ? 'gps' : 'any', ret: !!existing.ret, q: ''}
    : {id: null, name: '', sel: new Set(preselect || []), startMode: 'gps', ret: false, q: ''};
  $('#builder').innerHTML = `
    <div class="nav titled"><button class="link" id="bCancel">Cancel</button><div class="t">${existing ? 'Edit Route' : 'New Route'}</div>
      <button class="link b" id="bSave">${existing ? 'Save' : 'Create'}</button></div>
    <div class="wrap">
      <div class="label">Name</div>
      <div class="grp"><input class="field" id="bName" placeholder="Purim Route" value="${esc(B.name)}" autocomplete="off"></div>
      <div class="label">Start from</div>
      ${segHTML('start', [['gps', 'My Location'], ['any', 'Best First Stop']], B.startMode)}
      <div class="grp" id="bRetRow" style="margin-top:10px" ${B.startMode === 'gps' ? '' : 'hidden'}><div class="toggle"><span>Come back here at the end</span>
        <button class="switch ${B.ret ? 'on' : ''}" id="bRet" aria-label="Come back here at the end"></button></div></div>
      <div class="picked"><span><b id="bCount">0</b> selected</span><button class="link" id="bClear" style="font-size:15px">Clear</button></div>
    </div>
    <div class="bsearch wrap"><label class="search"><svg class="ico"><use href="#i-search"/></svg>
      <input id="bq" type="search" placeholder="Search to add families" autocomplete="off" autocorrect="off" spellcheck="false"></label></div>
    <div class="wrap" id="bList"></div>`;
  renderBuilderList();
  pinBuilderSearch();
  openPage('#builder');
}
// The search bar sticks directly under the top bar, whose height depends on the phone's notch area.
function pinBuilderSearch(){ const nav = $('#builder .nav'), bs = $('#builder .bsearch'); if(nav && bs) bs.style.top = (nav.offsetHeight - 1) + 'px'; }
addEventListener('resize', pinBuilderSearch);
function renderBuilderList(){
  const q = B.q.trim(), items = matches(q);
  let html = '';
  if(!q && B.sel.size){
    const chosen = D.filter(p => B.sel.has(p.i));
    html += `<div class="blist" style="margin-bottom:20px"><h2 class="sh">Selected</h2>${chosen.map(p => rowHTML(p, 'pick').replace('class="row"', 'class="row sel"')).join('')}</div>`;
  }
  $('#bList').innerHTML = html + `<div class="blist">${listHTML(items, 'pick', B.sel)}</div>`;
  $('#bCount').textContent = B.sel.size;
}
let bqT;
$('#builder').addEventListener('input', e => {
  if(e.target.id === 'bq'){ B.q = e.target.value; clearTimeout(bqT); bqT = setTimeout(renderBuilderList, 80); }
  if(e.target.id === 'bName') B.name = e.target.value;
});
$('#builder').addEventListener('click', async e => {
  const row = e.target.closest('.row');
  if(row){
    const i = +row.dataset.i;
    if(!D[i].ll && !B.sel.has(i)) toast('No map location for this address; it will go last');
    B.sel.has(i) ? B.sel.delete(i) : B.sel.add(i);
    document.querySelectorAll(`#bList .row[data-i="${i}"]`).forEach(r => r.classList.toggle('sel', B.sel.has(i)));
    $('#bCount').textContent = B.sel.size;
    return;
  }
  const seg = e.target.closest('[data-seg="start"] button');
  if(seg){ B.startMode = seg.dataset.v; seg.parentElement.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === seg));
    $('#bRetRow').hidden = B.startMode !== 'gps'; return; }
  if(e.target.closest('#bRet')){ B.ret = !B.ret; $('#bRet').classList.toggle('on', B.ret); return; }
  if(e.target.closest('#bClear')){ B.sel.clear(); renderBuilderList(); return; }
  if(e.target.closest('#bCancel')){ closePage('#builder'); return; }
  if(e.target.closest('#bSave')){
    if(B.sel.size < 1){ toast('Pick at least one family'); return; }
    const btn = $('#bSave'); btn.disabled = true; btn.textContent = 'Planning…';
    let r = B.id ? routes.find(x => x.id === B.id) : null;
    const isNew = !r;
    let start = r && r.start || null;
    if(B.startMode === 'gps' && (isNew || !start)){
      start = await here().catch(() => null);
      if(!start) toast('Location unavailable, so ordered from the best first stop');
    }
    if(B.startMode === 'any') start = null;
    const name = (B.name || '').trim() || 'Route ' + (routes.length + (isNew ? 1 : 0));
    if(isNew){ r = {id: Date.now().toString(36), done: [], created: Date.now()}; routes.unshift(r); }
    // keep the existing order for stops that stay, so plan() only re-orders what's left to visit
    const keepOrder = r.ids ? r.ids.filter(i => B.sel.has(i)) : [];
    Object.assign(r, {name, ids: [...keepOrder, ...[...B.sel].filter(i => !keepOrder.includes(i))], start, ret: !!(start && B.ret)});
    r.done = (r.done || []).filter(i => B.sel.has(i));
    await new Promise(res => setTimeout(res, 20));
    plan(r, r.done.length ? await whereNow(r, false) : start);
    saveRoutes(); renderRoutes();
    closePage('#builder'); showRoute(r.id, $('#routeView').classList.contains('on'));
  }
});
function here(){
  return new Promise((res, rej) => {
    if(!navigator.geolocation) return rej();
    navigator.geolocation.getCurrentPosition(p => res([+p.coords.latitude.toFixed(5), +p.coords.longitude.toFixed(5)]), rej,
      {enableHighAccuracy: false, timeout: 10000, maximumAge: 60000});
  });
}
// Share links carry family keys (not list positions) and are UTF-8 safe, so any route name works.
const b64url = str => btoa(String.fromCharCode(...new TextEncoder().encode(str))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const unb64url = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0)));
function shareRoute(r){
  const url = location.origin + location.pathname + '#route=' + b64url(JSON.stringify({v: 2, n: r.name, k: toKeys(r.ids), r: r.ret ? 1 : 0}));
  if(navigator.share) navigator.share({title: r.name, text: r.name + ' (open in the Directory app)', url}).catch(() => {});
  else navigator.clipboard?.writeText(url).then(() => toast('Link copied'));
}
function importFromHash(){
  const m = location.hash.match(/#route=([\w-]+)/);
  if(!m) return;
  history.replaceState(null, '', location.pathname);
  try{
    const o = JSON.parse(unb64url(m[1]));
    const ids = o.k ? fromKeys(o.k) : (o.i || []).filter(i => D[i]);
    if(!ids.length) return;
    const r = {id: Date.now().toString(36), name: o.n || 'Shared Route', ids, start: null, ret: false, done: [], created: Date.now()};
    routes.unshift(r); saveRoutes();
    openRoutes(); showRoute(r.id); toast('Route added');
  }catch{}
}

/* ---------------- list + search wiring ---------------- */
$('#list').addEventListener('click', e => {
  const row = e.target.closest('.row'); if(row) showPerson(+row.dataset.i);
});
let qT;
$('#q').addEventListener('input', () => { clearTimeout(qT); qT = setTimeout(() => { renderPeople(); scrollTo(0, 0); }, 60); });
document.addEventListener('keydown', e => { if(e.key === 'Enter' && e.target.matches('#q, #bq')) e.target.blur(); });
// like iOS: dragging the list puts the keyboard away
['#list', '#bList'].forEach(sel => document.addEventListener('touchmove', e => {
  const a = document.activeElement;
  if(a && a.matches('#q, #bq') && e.target.closest(sel)) a.blur();
}, {passive: true}));
$('#qClear').addEventListener('click', () => { $('#q').value = ''; renderPeople(); $('#q').blur(); });

let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2400); }

/* ---------------- boot ---------------- */
function start(rows){
  prep(rows);
  indexKeys(); loadRoutes();
  $('#lock').hidden = true; $('#app').hidden = false;
  renderPeople(); renderRoutes();
  requestAnimationFrame(placeIdx);
  importFromHash();
}
$('#lockForm').addEventListener('submit', async e => {
  e.preventDefault();
  const pass = $('#pass').value.trim(), btn = $('#unlockBtn');
  if(!pass) return;
  btn.disabled = true; btn.textContent = 'Unlocking…'; $('#lockErr').textContent = '';
  // iPhones auto-capitalise and turn "-" into dashes; accept those and spaces instead of hyphens.
  const loose = pass.normalize('NFKC').toLowerCase().replace(/[\u2010-\u2015\u2212\s_]+/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
  try{
    let key, rows;
    for(const cand of [...new Set([pass, loose])]){
      try{ key = await deriveKey(cand); rows = await decryptWith(key); break; }catch{ rows = null; }
    }
    if(!rows) throw new Error('bad passcode');
    store.set('key', b64e(await crypto.subtle.exportKey('raw', key)));
    $('#pass').blur(); start(rows);
  }catch{
    $('#lockErr').textContent = 'That passcode didn’t work.';
    const f = $('#lockForm'); f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake');
  }
  btn.disabled = false; btn.textContent = 'Unlock';
});
addEventListener('hashchange', () => { if(D.length) importFromHash(); });
(async () => {
  const rows = await tryStoredKey();
  if(rows) start(rows); else { $('#lock').hidden = false; }
})();
if('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
